name: sanegenebio
description: SanegeneBio is a clinical-stage biotechnology company developing RNAi (RNA interference)
  genetic medicines for metabolic, cardiovascular, and complement-mediated autoimmune diseases,
  including obesity. Its proprietary LEAD (Ligand and Enhancer Assisted Delivery) platform enables
  receptor-mediated, targeted delivery of siRNA therapeutics to adipocytes, skeletal myocytes, and
  other tissues beyond the liver. The company operates as a fully integrated global biotech and has
  raised over $150 million to advance its pipeline. Surfaced as a portfolio company of Qiming and
  added to the API Evangelist network; it publishes a corporate website (about, technology, pipeline,
  news, contact) but no public developer, API, or documentation surface at this time.
